name: Linux Build

# These jobs are to be triggered by ar.yml

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
      config:
        required: true
        type: string
      image:
        required: true
        type: string
      platform:
        required: true
        type: string
      type:
        required: true
        type: string
      last_artifact:
        required: false
        type: boolean
      desktop:
        required: false
        type: boolean
      clang_version:
        required: false
        type: string
      gcc_version:
        required: false
        type: string
      cmake_version:
        required: false
        type: string

run-name: ${{ inputs.platform }} - ${{ inputs.type }}

# Note: All 3P Github Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

jobs:
  Build:
    runs-on: ${{ inputs.image }}

    steps:
      - name: Check disk space
        # Check if the workspace has enough free space, otherwise flag the disk for resizing
        env:
          MIN_FREE_DISK: 70 # in GB
        id: check-disk
        run: |
          AVAIL_GB=$(df ${{ github.workspace }} --output=avail --block-size=1G | tail -1 | tr -d ' ')
          echo "Workspace has ${AVAIL_GB}GB available"
          if [ "$AVAIL_GB" -lt ${{ env.MIN_FREE_DISK }} ]; then
            echo "needs_resize=true" >> $GITHUB_OUTPUT
            echo "Workspace has less than ${{ env.MIN_FREE_DISK }}GB available, resizing disk"
          else
            echo "needs_resize=false" >> $GITHUB_OUTPUT
            echo "Workspace has enough free space, skipping disk resize"
          fi

      - name: Maximize build space
        # Resize and combine disks as LVM to maximize space for builds, if below the minimum free space
        if: steps.check-disk.outputs.needs_resize == 'true'
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 8000
          swap-size-mb: 200
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Git LFS pull
        # Minimal pull for profile builds, otherwise pull all
        run: |
          git lfs install
          [[ "${{ inputs.type }}" == "profile" ]] && git lfs pull --include "*.ico,*.bmp" || git lfs pull

      - name: Setup 3p, user, and build folders
        run: |
          mkdir -p .o3de build 3rdParty && ln -sf "$(pwd)/.o3de" ~/.o3de

      - name: Setup ccache
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb # v1.5.3
        continue-on-error: true
        if: always()
        with:
          prepend_symlinks_to_path: false
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ github.workspace }}/.ccache
            hash_dir=false
            max_size=5G

      - name: Restore build cache
        # Profile builds: get the cache from the last run of the target branch, or from an earlier attempt on reruns
        # Other builds: get the cache uploaded by the profile job of this run
        # Skip the last run if last_artifact is not set, to build without a cache
        id: restore-build
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache
          current-run: ${{ inputs.type != 'profile' || github.run_attempt > 1 }}
          last-run: ${{ inputs.type == 'profile' && inputs.last_artifact }}

      - name: Reset ccache stats
        if: ${{ steps.restore-build.outputs.restored == 'true' }}
        run: ccache --zero-stats --cleanup

      - name: Restore asset cache
        # Asset builds: get the assets from an earlier attempt, otherwise from the last run of the target branch
        # Test builds: get the assets uploaded by the asset job of this run
        # Skip the last run if last_artifact is not set, to process assets without a cache
        if: ${{ inputs.type != 'profile' }}
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache
          last-run: ${{ inputs.type == 'asset_profile' && inputs.last_artifact }}

      - name: Setup cmake
        # Pin the version of cmake
        if: ${{ inputs.cmake_version }}
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # v4.2.3
        with:
          cmakeVersion: "${{ inputs.cmake_version }}"

      - name: Set GCC version
        # GitHub-hosted runners pre-install multiple GCC versions; this step selects the requested one
        # via update-alternatives so Clang picks up the correct libstdc++ headers and libraries.
        # ubuntu-24.04 ships gcc-12/13/14; ubuntu-22.04 ships gcc-9/10/11/12.
        if: ${{ inputs.gcc_version }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -y
          sudo apt-get install -y gcc-${{ inputs.gcc_version }} g++-${{ inputs.gcc_version }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ inputs.gcc_version }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ inputs.gcc_version }} 100

      - name: Install specific clang version
        # Use the official LLVM installer script so we can install arbitrary upstream Clang versions
        # on GitHub-hosted runners (beyond what's in the distro's default apt repositories).
        #
        # Ref: https://apt.llvm.org/llvm.sh
        if: ${{ inputs.compiler == 'clang' && inputs.clang_version }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ inputs.clang_version }}
          sudo apt-get install -y lld-${{ inputs.clang_version }} clang-tools-${{ inputs.clang_version }}
          echo "CC=$(which clang-${{ inputs.clang_version }})" >> $GITHUB_ENV
          echo "CXX=$(which clang++-${{ inputs.clang_version }})" >> $GITHUB_ENV

      - name: Configure environment
        # Install dependencies. The desktop packages are for tests and assetprocessor
        run: |
          echo "Installing dependencies"
          pushd ./scripts/build/build_node/Platform/Linux
          sudo ./install-ubuntu.sh
          popd
          echo "Getting python..."
          ./python/get_python.sh
          echo "Installing additional python dependencies..."
          ./python/pip.sh install tempfile2 PyGithub

          # If desktop is true, install desktop and x11 packages, otherwise install base packages
          [[ "${{ inputs.desktop }}" == "true" ]] && \
           sudo apt-get install -qq ubuntu-desktop libreoffice- thunderbird- xorg mesa-utils vulkan-tools libevdev-dev libevdev2 -y || \
           sudo apt-get install -qq libevdev-dev libevdev2 libxcb-cursor0 -y
          sudo apt -y autoremove --purge
          sudo apt -y autoclean
          sudo apt clean
          df -h

      - name: Build ${{ inputs.type }}
        # Builds with presets in ../scripts/build/Platform/Linux/build_config.json
        id: build
        timeout-minutes: 330
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          LY_PACKAGE_SERVER_URLS: "https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net"
        run: |
          export EXTRA_CMAKE_OPTIONS="-DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX"
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          xvfb_command=()
          if [ "${{ inputs.desktop }}" == "true" ]; then
            xvfb_command=(xvfb-run --auto-servernum --server-args="-screen 0 1400x1050x16 -noreset")
          fi
          "${xvfb_command[@]}" python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type ${{ inputs.type }}

      - name: Save build cache
        # Only profile builds upload the cache; later jobs in the run reuse it
        if: ${{ !cancelled() && inputs.type == 'profile' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache

      - name: Save asset cache
        # Only asset builds upload the asset cache; later jobs in the run reuse it
        if: ${{ !cancelled() && inputs.type == 'asset_profile' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache
