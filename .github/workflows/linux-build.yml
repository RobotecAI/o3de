name: Linux Build

# These jobs are to be triggered by ar.yml

on:
  workflow_call:
    inputs: &inputs
      compiler:
        description: Compiler to use (clang, gcc)
        required: false
        type: string
        default: clang
      config:
        description: Configuration preset from scripts/build/Platform/Linux/build_config.json (profile, release)
        required: false
        type: string
        default: profile
      image:
        description: Runner image (ubuntu-22.04, ubuntu-24.04)
        required: false
        type: string
        default: ubuntu-22.04
      platform:
        description: Platform to build
        required: false
        type: string
        default: Linux
      type:
        description: Build type (profile, asset_profile, test_profile, profile_asset_test, release)
        required: false
        type: string
        default: profile_asset_test
      use_cache:
        description: Restore the build and asset caches, otherwise start from a clean state
        required: false
        type: boolean
        default: true
      desktop:
        description: Install the desktop environment and run tests under xvfb
        required: false
        type: boolean
        default: true
      clang_version:
        description: Clang major version to install
        required: false
        type: string
        default: "18"
      gcc_version:
        description: GCC major version to install, provides libstdc++ for clang
        required: false
        type: string
        default: "13"
      cmake_version:
        description: CMake version to install, uses the runner version if empty
        required: false
        type: string
  workflow_dispatch:
    inputs: *inputs

run-name: ${{ inputs.platform }} - ${{ inputs.type }}

# Note: All 3P Github Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

jobs:
  Build:
    runs-on: ${{ inputs.image }}

    env:
      # Phases run by this job; profile_asset_test runs all of them in one job to share setup and the build folder
      BUILD_PHASE: ${{ inputs.type == 'profile' || inputs.type == 'profile_asset_test' }}
      ASSET_PHASE: ${{ inputs.type == 'asset_profile' || inputs.type == 'profile_asset_test' }}
      TEST_PHASE: ${{ inputs.type == 'test_profile' || inputs.type == 'profile_asset_test' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      LY_3RDPARTY_PATH: ${{ github.workspace }}/3rdParty
      LY_PACKAGE_SERVER_URLS: "https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net"

    steps:
      - name: Check disk space
        # Check if the workspace has enough free space, otherwise flag the disk for resizing
        env:
          MIN_FREE_DISK: 70 # in GB
        id: check-disk
        run: |
          AVAIL_GB=$(df ${{ github.workspace }} --output=avail --block-size=1G | tail -1 | tr -d ' ')
          echo "Workspace has ${AVAIL_GB}GB available"
          if [ "$AVAIL_GB" -lt ${{ env.MIN_FREE_DISK }} ]; then
            echo "needs_resize=true" >> $GITHUB_OUTPUT
            echo "Workspace has less than ${{ env.MIN_FREE_DISK }}GB available, resizing disk"
          else
            echo "needs_resize=false" >> $GITHUB_OUTPUT
            echo "Workspace has enough free space, skipping disk resize"
          fi

      - name: Maximize build space
        # Resize and combine disks as LVM to maximize space for builds, if below the minimum free space
        if: steps.check-disk.outputs.needs_resize == 'true'
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 8000
          swap-size-mb: 200
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Git LFS pull
        # Minimal pull for profile builds, otherwise pull all
        run: |
          git lfs install
          [[ "${{ inputs.type }}" == "profile" ]] && git lfs pull --include "*.ico,*.bmp" || git lfs pull

      - name: Setup 3p, user, and build folders
        run: |
          mkdir -p .o3de build 3rdParty && ln -sf "$(pwd)/.o3de" ~/.o3de

      - name: Setup ccache
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb # v1.5.3
        continue-on-error: true
        if: always()
        with:
          prepend_symlinks_to_path: false
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ github.workspace }}/.ccache
            hash_dir=false
            max_size=10G

      - name: Restore build cache
        # Get the cache from an earlier job or attempt of this run, otherwise from the latest run of the target branch
        # Skipped if use_cache is not set, to build from a clean state
        if: ${{ inputs.use_cache }}
        id: restore-build
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache

      - name: Reset ccache stats
        if: ${{ steps.restore-build.outputs.restored == 'true' }}
        run: ccache --zero-stats --cleanup

      - name: Restore asset cache
        # Get the assets from an earlier job or attempt of this run, otherwise from the latest run of the target branch
        # Skipped if use_cache is not set, to process assets from a clean state
        if: ${{ inputs.use_cache && (env.ASSET_PHASE == 'true' || env.TEST_PHASE == 'true') }}
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache

      - name: Setup cmake
        # Pin the version of cmake
        if: ${{ inputs.cmake_version }}
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "${{ inputs.cmake_version }}"

      - name: Set GCC version
        # GitHub-hosted runners pre-install multiple GCC versions; this step selects the requested one
        # via update-alternatives so Clang picks up the correct libstdc++ headers and libraries.
        # ubuntu-24.04 ships gcc-12/13/14; ubuntu-22.04 ships gcc-9/10/11/12.
        if: ${{ inputs.gcc_version }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -y
          sudo apt-get install -y gcc-${{ inputs.gcc_version }} g++-${{ inputs.gcc_version }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ inputs.gcc_version }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ inputs.gcc_version }} 100

      - name: Install specific clang version
        # Use the official LLVM installer script so we can install arbitrary upstream Clang versions
        # on GitHub-hosted runners (beyond what's in the distro's default apt repositories).
        #
        # Ref: https://apt.llvm.org/llvm.sh
        if: ${{ inputs.compiler == 'clang' && inputs.clang_version }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ inputs.clang_version }}
          sudo apt-get install -y lld-${{ inputs.clang_version }} clang-tools-${{ inputs.clang_version }}
          echo "CC=$(which clang-${{ inputs.clang_version }})" >> $GITHUB_ENV
          echo "CXX=$(which clang++-${{ inputs.clang_version }})" >> $GITHUB_ENV

      - name: Configure environment
        # Install dependencies. The desktop packages for tests are installed before the test phase
        run: |
          echo "Installing dependencies"
          pushd ./scripts/build/build_node/Platform/Linux
          sudo ./install-ubuntu.sh
          popd
          echo "Getting python..."
          ./python/get_python.sh
          echo "Installing additional python dependencies..."
          ./python/pip.sh install tempfile2 PyGithub
          sudo apt-get install -qq libevdev-dev libevdev2 libxcb-cursor0 -y
          sudo apt -y autoremove --purge
          sudo apt -y autoclean
          sudo apt clean
          df -h

      - name: Configure build environment
        # Pass the selected compilers to cmake and put the ccache wrappers first in the path
        run: |
          echo "EXTRA_CMAKE_OPTIONS=-DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX" >> $GITHUB_ENV
          echo "/usr/local/opt/ccache/libexec" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Build profile
        # Builds with presets in ../scripts/build/Platform/Linux/build_config.json
        id: build-profile
        if: ${{ env.BUILD_PHASE == 'true' }}
        timeout-minutes: 330
        run: |
          python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type profile

      - name: Save build cache
        # Only the build phase uploads the cache; later jobs in the run reuse it
        # Saved right after the build, so a rerun of a later failing phase starts with a warm cache
        if: ${{ !cancelled() && steps.build-profile.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache

      - name: Process assets
        # Reuses the build folder of the build phase when run in the same job, otherwise builds AssetProcessorBatch
        id: build-assets
        if: ${{ env.ASSET_PHASE == 'true' }}
        timeout-minutes: 330
        run: |
          python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type asset_profile

      - name: Save asset cache
        # Only a successful asset phase uploads the asset cache, so partial assets never reach later runs
        if: ${{ steps.build-assets.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache

      - name: Install desktop packages
        # Desktop and x11 packages for tests running under xvfb
        if: ${{ env.TEST_PHASE == 'true' && inputs.desktop }}
        run: |
          sudo apt-get install -qq ubuntu-desktop libreoffice- thunderbird- xorg mesa-utils vulkan-tools -y
          sudo apt -y autoremove --purge
          sudo apt -y autoclean
          sudo apt clean
          df -h

      - name: Run tests
        # Reuses the build folder of the build phase when run in the same job, otherwise builds all targets
        if: ${{ env.TEST_PHASE == 'true' }}
        timeout-minutes: 330
        run: |
          xvfb_command=()
          if [ "${{ inputs.desktop }}" == "true" ]; then
            xvfb_command=(xvfb-run --auto-servernum --server-args="-screen 0 1400x1050x16 -noreset")
          fi
          "${xvfb_command[@]}" python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type test_profile
