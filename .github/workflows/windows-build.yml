name: Windows Build

# These jobs are to be triggered by ar.yml

on:
  workflow_call:
    inputs: &inputs
      compiler:
        description: Compiler to use
        required: false
        type: string
        default: msvc
      config:
        description: Configuration preset from scripts/build/Platform/Windows/build_config.json (profile, release)
        required: false
        type: string
        default: profile
      image:
        description: Runner image (windows-2022, windows-2025)
        required: false
        type: string
        default: windows-2022
      platform:
        description: Platform to build
        required: false
        type: string
        default: Windows
      type:
        description: Build type (profile, asset_profile, test_cpu_profile, profile_asset_test, release)
        required: false
        type: string
        default: profile_asset_test
      use_cache:
        description: Restore the build and asset caches, otherwise start from a clean state
        required: false
        type: boolean
        default: true
      msvc_toolset_version:
        description: MSVC toolset version to install (e.g. 14.44), uses the latest installed toolset if empty
        required: false
        type: string
      msvc_platform_toolset:
        description: MSVC platform toolset name (e.g. v143), uses the generator default if empty
        required: false
        type: string
      cmake_version:
        description: CMake version to install, uses the runner version if empty
        required: false
        type: string
  workflow_dispatch:
    inputs: *inputs

run-name: ${{ inputs.platform }} - ${{ inputs.type }}

# Activate compiler cache
env:
  CMAKE_C_COMPILER_LAUNCHER: C:\ProgramData\Chocolatey\bin\ccache.exe
  CMAKE_CXX_COMPILER_LAUNCHER: C:\ProgramData\Chocolatey\bin\ccache.exe
  LY_PACKAGE_SERVER_URLS: "https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net"

# Note: All 3P Github Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

jobs:
  Build:
    runs-on: ${{ inputs.image }}

    env:
      # Phases run by this job; profile_asset_test runs all of them in one job to share setup and the build folder
      BUILD_PHASE: ${{ inputs.type == 'profile' || inputs.type == 'release' || inputs.type == 'profile_asset_test' }}
      ASSET_PHASE: ${{ inputs.type == 'asset_profile' || inputs.type == 'profile_asset_test' }}
      TEST_PHASE: ${{ inputs.type == 'test_cpu_profile' || inputs.type == 'profile_asset_test' }}
      BUILD_TYPE: ${{ inputs.type == 'profile_asset_test' && 'profile' || inputs.type }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Git LFS pull
        # Minimal pull for profile builds, otherwise pull all
        run: |
          git lfs install
          if ("${{ inputs.type }}" -eq "profile") { git lfs pull --include "*.ico,*.bmp" } else { git lfs pull }

      - name: Setup DevDrive
        uses: samypr100/setup-dev-drive@b9079d2711b01ed39de859c79c96484bfd80e078 # v3.4.1
        with:
          drive-size: 130GB
          drive-format: NTFS
          drive-path: "D:/dev_drive.vhdx"
          workspace-copy: true
          trusted-dev-drive: true

      - name: Setup 3p, user, and build folders
        # Symlink the .o3de folder to the github workspace to avoid permission issues
        run: |
          "3rdParty", "build", ".o3de" | % {New-Item "${{ env.DEV_DRIVE_WORKSPACE }}\$_" -ItemType 'Directory' -Force}
          "temp" | % {New-Item "${{ env.DEV_DRIVE }}\$_" -ItemType 'Directory' -Force}
          ".o3de" | % {New-Item -Path $env:USERPROFILE\$_ -ItemType SymbolicLink -Target ${{ env.DEV_DRIVE_WORKSPACE }}\$_ -Force}
          "AutomatedTesting\Cache", "AutomatedTesting\user" | % {New-Item "${{ env.DEV_DRIVE_WORKSPACE }}\$_" -ItemType 'Directory' -Force}

      - name: Move Page File to Workspace drive
        # Configure the page file to the workspace drive for the duration of the run
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" `
            -Name "PagingFiles" -Value "${{ env.DEV_DRIVE }}\temp\pagefile.sys 8192 8192"
          echo "Page file moved to ${{ env.DEV_DRIVE }}\temp\pagefile.sys"

      - name: Get drive info
        run: |
          Get-PSDrive

      - name: Setup ccache
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb # v1.5.3
        continue-on-error: true
        if: always()
        with:
          windows_compile_environment: msvc
          prepend_symlinks_to_path: false
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ env.DEV_DRIVE_WORKSPACE }}\.ccache
            hash_dir=false
            inode_cache=true
            max_size=10G
            temporary_dir=${{ env.DEV_DRIVE }}\temp

      - name: Restore build cache
        # Get the cache from an earlier job or attempt of this run, otherwise from the latest run of the target branch
        # Skipped if use_cache is not set, to build from a clean state
        if: ${{ inputs.use_cache }}
        id: restore-build
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

      - name: Reset ccache stats
        if: ${{ steps.restore-build.outputs.restored == 'true' }}
        run: ccache --zero-stats --cleanup

      - name: Restore asset cache
        # Get the assets from an earlier job or attempt of this run, otherwise from the latest run of the target branch
        # Skipped if use_cache is not set, to process assets from a clean state
        if: ${{ inputs.use_cache && (env.ASSET_PHASE == 'true' || env.TEST_PHASE == 'true') }}
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

      - name: Setup cmake
        # Pin the version of cmake
        if: ${{ inputs.cmake_version }}
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "${{ inputs.cmake_version }}"

      - name: Configure generator/toolset env for CMake
        # Set the environment variables for the CMake generator and toolset.
        #
        # Guard behavior:
        # - If msvc_platform_toolset is not provided, do NOT set CMAKE_GENERATOR_TOOLSET.
        # - If msvc_platform_toolset is provided and msvc_toolset_version is NOT, set toolset to just "v143" (no version pin).
        # - If both are provided, pin the version via "v143,version=14.xx".
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

          $platformToolset = "${{ inputs.msvc_platform_toolset }}"
          $toolsetVersion  = "${{ inputs.msvc_toolset_version }}"

          if (![string]::IsNullOrWhiteSpace($platformToolset)) {

            if (![string]::IsNullOrWhiteSpace($toolsetVersion)) {
              echo "CMAKE_GENERATOR_TOOLSET=$platformToolset,version=$toolsetVersion" >> $env:GITHUB_ENV
            } else {
              # No version requested: MSBuild line is selected by msvc-dev-cmd.
              echo "CMAKE_GENERATOR_TOOLSET=$platformToolset" >> $env:GITHUB_ENV
            }
          }

      - name: Install specific MSVC toolset
        # Install a specific MSVC toolset into VS2022
        if: ${{ inputs.msvc_toolset_version && inputs.msvc_platform_toolset }}
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
            --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" `
            --add "Microsoft.VisualStudio.Component.VC.${{ inputs.msvc_toolset_version }}.x86.x64" --quiet --wait

      - name: Set MSBuild options (default toolset)
        if: ${{ !inputs.msvc_toolset_version }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Set MSBuild options (pinned toolset)
        if: ${{ inputs.msvc_toolset_version }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          toolset: ${{ inputs.msvc_toolset_version }}

      - name: Configure environment
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          echo "Installing dependencies"
          echo "Getting python..."
          python\get_python.bat
          echo "Installing additional python dependencies..."
          python\pip.sh install tempfile2 PyGithub

      - name: Configure build environment
        # Set 3rdParty and temp folders to the workspace drive as the boot drive is slow
        run: |
          echo "LY_3RDPARTY_PATH=${{ env.DEV_DRIVE_WORKSPACE }}\3rdParty" >> $env:GITHUB_ENV
          echo "TEMP=${{ env.DEV_DRIVE }}\temp" >> $env:GITHUB_ENV
          echo "TMP=${{ env.DEV_DRIVE }}\temp" >> $env:GITHUB_ENV

      - name: Build ${{ env.BUILD_TYPE }}
        # Builds with presets in ../scripts/build/Platform/Windows/build_config.json
        id: build-profile
        if: ${{ env.BUILD_PHASE == 'true' }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        timeout-minutes: 330
        run: |
          python\python.cmd -u scripts\build\ci_build.py --platform ${{ inputs.platform }} --type ${{ env.BUILD_TYPE }}

      - name: Save build cache
        # Only the build phase uploads the cache; later jobs in the run reuse it
        # Saved right after the build, so a rerun of a later failing phase starts with a warm cache
        if: ${{ !cancelled() && steps.build-profile.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

      - name: Process assets
        # Reuses the build folder of the build phase when run in the same job, otherwise builds AssetProcessorBatch
        id: build-assets
        if: ${{ env.ASSET_PHASE == 'true' }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        timeout-minutes: 330
        run: |
          python\python.cmd -u scripts\build\ci_build.py --platform ${{ inputs.platform }} --type asset_profile

      - name: Save asset cache
        # Only a successful asset phase uploads the asset cache, so partial assets never reach later runs
        if: ${{ steps.build-assets.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

      - name: Run tests
        # Reuses the build folder of the build phase when run in the same job, otherwise builds the test suites
        if: ${{ env.TEST_PHASE == 'true' }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        timeout-minutes: 330
        run: |
          python\python.cmd -u scripts\build\ci_build.py --platform ${{ inputs.platform }} --type test_cpu_profile
