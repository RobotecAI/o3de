name: Android Build

# These jobs are to be triggered by ar.yml

on:
  workflow_call:
    inputs: &inputs
      compiler:
        description: Compiler to use
        required: false
        type: string
        default: clang
      config:
        description: Configuration preset from scripts/build/Platform/Android/build_config.json (profile, release)
        required: false
        type: string
        default: profile
      image:
        description: Runner image (ubuntu-22.04, ubuntu-24.04)
        required: false
        type: string
        default: ubuntu-22.04
      platform:
        description: Platform to build
        required: false
        type: string
        default: Android
      type:
        description: Build type (profile, asset_profile, gradle, profile_asset_gradle, release)
        required: false
        type: string
        default: profile_asset_gradle
      use_cache:
        description: Restore the build and asset caches, otherwise start from a clean state
        required: false
        type: boolean
        default: true
      clang_version:
        description: Host clang major version to install, uses the runner compiler if empty
        required: false
        type: string
      ndk_version:
        description: Android NDK version to install, uses the preinstalled NDK if empty
        required: false
        type: string
      cmake_version:
        description: CMake version to install, uses the runner version if empty
        required: false
        type: string
      gradle_version:
        description: Gradle version to install
        required: false
        type: string
  workflow_dispatch:
    inputs: *inputs

run-name: ${{ inputs.platform }} - ${{ inputs.type }}

env:
  NDK_VERSION: ${{ inputs.ndk_version }}
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  LY_3RDPARTY_PATH: ${{ github.workspace }}/3rdParty
  LY_PACKAGE_SERVER_URLS: "https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net"

# Note: All 3P Github Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

jobs:
  Build:
    runs-on: ${{ inputs.image }}

    env:
      # Phases run by this job; profile_asset_gradle runs all of them in one job to share setup
      BUILD_PHASE: ${{ inputs.type == 'profile' || inputs.type == 'profile_asset_gradle' }}
      ASSET_PHASE: ${{ inputs.type == 'asset_profile' || inputs.type == 'profile_asset_gradle' }}
      GRADLE_PHASE: ${{ inputs.type == 'gradle' || inputs.type == 'profile_asset_gradle' }}

    steps:
      - name: Check disk space
        # Check if the workspace has enough free space, otherwise flag the disk for resizing
        env:
          MIN_FREE_DISK: 70 # in GB
        id: check-disk
        run: |
          AVAIL_GB=$(df ${{ github.workspace }} --output=avail --block-size=1G | tail -1 | tr -d ' ')
          echo "Workspace has ${AVAIL_GB}GB available"
          if [ "$AVAIL_GB" -lt ${{ env.MIN_FREE_DISK }} ]; then
            echo "needs_resize=true" >> $GITHUB_OUTPUT
            echo "Workspace has less than ${{ env.MIN_FREE_DISK }}GB available, resizing disk"
          else
            echo "needs_resize=false" >> $GITHUB_OUTPUT
            echo "Workspace has enough free space, skipping disk resize"
          fi

      - name: Maximize build space
        # Resize and combine disks as LVM to maximize space for builds, if below the minimum free space
        if: steps.check-disk.outputs.needs_resize == 'true'
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 8000
          swap-size-mb: 200
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Git LFS pull
        # Minimal pull for profile builds, otherwise pull all
        run: |
          git lfs install
          [[ "${{ inputs.type }}" == "profile" ]] && git lfs pull --include "*.ico,*.bmp" || git lfs pull

      - name: Setup 3p, user, and build folders
        run: |
          mkdir -p .o3de build 3rdParty && ln -sf "$(pwd)/.o3de" ~/.o3de

      - name: Setup ccache
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb # v1.5.3
        continue-on-error: true
        if: always()
        with:
          prepend_symlinks_to_path: false
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ github.workspace }}/.ccache
            hash_dir=false
            max_size=10G

      - name: Restore build cache
        # Get the cache from an earlier job or attempt of this run, otherwise from the latest run of the target branch
        # Skipped if use_cache is not set, to build from a clean state
        if: ${{ inputs.use_cache }}
        id: restore-build
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache

      - name: Reset ccache stats
        if: ${{ steps.restore-build.outputs.restored == 'true' }}
        run: ccache --zero-stats --cleanup

      - name: Restore asset cache
        # Get the assets from an earlier job or attempt of this run, otherwise from the latest run of the target branch
        # Skipped if use_cache is not set, to process assets from a clean state
        if: ${{ inputs.use_cache && (env.ASSET_PHASE == 'true' || env.GRADLE_PHASE == 'true') }}
        uses: ./.github/actions/restore-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache

      - name: Setup cmake
        # Pin the version of cmake
        if: ${{ inputs.cmake_version }}
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "${{ inputs.cmake_version }}"
          ninjaVersion: "1.13.2"

      - name: Setup java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 17

      - name: Setup clang
        # Use the official LLVM installer script so we can install arbitrary upstream Clang versions.
        # Ref: https://apt.llvm.org/llvm.sh
        #
        # NOTE: This clang is the *host* compiler used on the Linux runner.
        # The Android NDK provides its own clang toolchain for cross-compiling to Android.
        if: ${{ inputs.clang_version }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ inputs.clang_version }}
          sudo apt-get install -y lld-${{ inputs.clang_version }}
          echo "CC=$(which clang-${{ inputs.clang_version }})" >> $GITHUB_ENV
          echo "CXX=$(which clang++-${{ inputs.clang_version }})" >> $GITHUB_ENV

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: ${{ inputs.gradle_version }}
        with:
          gradle-version: '${{ inputs.gradle_version }}'
          add-job-summary: on-failure

      - name: Configure environment
        # Install dependencies for gradle and clang builds from the NDK
        continue-on-error: true
        run: |
          echo "Installing dependencies"
          pushd ./scripts/build/build_node/Platform/Linux
          sudo ./install-ubuntu.sh
          popd
          echo "Getting python..."
          ./python/get_python.sh
          echo "Installing additional python dependencies..."
          ./python/pip.sh install tempfile2 PyGithub

          if [[ -n "${{ inputs.ndk_version }}" ]]; then
            echo "Installing NDK ${{ env.NDK_VERSION }}..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.NDK_VERSION }}" --sdk_root="$ANDROID_HOME"
          else
            echo "Using preinstalled NDK"
          fi

          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$ANDROID_HOME" || true

          if [[ -n "${{ inputs.ndk_version }}" ]]; then
            echo "LY_NDK_DIR=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "JDK_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "USE_GRADLE_FROM_PATH=1" >> $GITHUB_ENV

      - name: Register engine
        run: scripts/o3de.sh register --this-engine

      - name: Build profile
        # Builds with presets in ../scripts/build/Platform/Android/build_config.json
        id: build-profile
        if: ${{ env.BUILD_PHASE == 'true' }}
        timeout-minutes: 330
        run: python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type profile

      - name: Process assets
        # Builds the host AssetProcessorBatch in build/linux, separate from the Android build folder
        id: build-assets
        if: ${{ env.ASSET_PHASE == 'true' }}
        timeout-minutes: 330
        run: python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type asset_profile

      - name: Save asset cache
        # Only a successful asset phase uploads the asset cache, so partial assets never reach later runs
        if: ${{ steps.build-assets.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-assets
          path: AutomatedTesting/Cache

      - name: Build gradle
        # Generates and builds the gradle project in build/ad_grd
        id: build-gradle
        if: ${{ env.GRADLE_PHASE == 'true' }}
        timeout-minutes: 330
        run: python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type gradle

      - name: Save build cache
        # Only the build phase uploads the cache; later jobs in the run reuse it
        # Saved after the asset and gradle phases to include the host and gradle native objects
        if: ${{ !cancelled() && steps.build-profile.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/save-artifact
        with:
          name: O3DE-${{ inputs.platform }}-${{ inputs.config }}-build
          path: .ccache
