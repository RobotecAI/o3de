name: AR Canary

run-name: ${{ format('AR Canary - {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      android_build:
        description: Build Android
        type: boolean
        default: true
      ios_build:
        description: Build iOS
        type: boolean
        default: true
      linux_build:
        description: Build Linux
        type: boolean
        default: true
      mac_build:
        description: Build Mac
        type: boolean
        default: true
      windows_build:
        description: Build Windows
        type: boolean
        default: true

env:
  CMAKE_VERSION: &cmake_version "4.2.3"

jobs:
  #### Android Canary - ubuntu-24.04 ####
  Android-Ubuntu24-Profile:
    # Builds, processes assets and builds the gradle project in a single job to share setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.android_build }}
    uses: ./.github/workflows/android-build.yml
    with:
      compiler: clang
      config: profile
      image: ubuntu-24.04
      platform: Android
      type: profile_asset_gradle
      use_cache: false
      ndk_version: "28.0.12433566"
      gradle_version: "8.13"
      cmake_version: *cmake_version

  #### Android Canary - ubuntu-22.04 ####
  Android-Ubuntu22-Profile:
    # Builds, processes assets and builds the gradle project in a single job to share setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.android_build }}
    uses: ./.github/workflows/android-build.yml
    with:
      compiler: clang
      config: profile
      image: ubuntu-22.04
      platform: Android
      type: profile_asset_gradle
      use_cache: false
      ndk_version: "28.0.12433566"
      gradle_version: "8.13"
      cmake_version: *cmake_version

  #### Linux Canary - ubuntu-24.04 ####
  Linux-Ubuntu24-Clang19-Profile:
    # Builds, processes assets and runs tests in a single job to share setup and the build folder
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_build }}
    uses: ./.github/workflows/linux-build.yml
    with:
      compiler: clang
      config: profile
      image: ubuntu-24.04
      platform: Linux
      type: profile_asset_test
      use_cache: false
      desktop: true
      clang_version: "19"
      gcc_version: "14"
      cmake_version: *cmake_version

  #### Linux Canary - ubuntu-22.04 ####
  Linux-Ubuntu22-Clang19-Profile:
    # Builds, processes assets and runs tests in a single job to share setup and the build folder
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_build }}
    uses: ./.github/workflows/linux-build.yml
    with:
      compiler: clang
      config: profile
      image: ubuntu-22.04
      platform: Linux
      type: profile_asset_test
      use_cache: false
      desktop: true
      clang_version: "19"
      gcc_version: "14"
      cmake_version: *cmake_version

  #### Mac Canary - macos-15 Apple Silicon ####
  Mac-macOS15-Profile:
    # Builds and processes assets in a single job to share setup and the build folder
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mac_build }}
    uses: ./.github/workflows/mac-build.yml
    with:
      config: profile
      image: macos-15
      type: profile_asset
      use_cache: false
      cmake_version: *cmake_version

  #### Mac Canary - macos-15-intel ####
  Mac-macOS15Intel-Profile:
    # Builds and processes assets in a single job to share setup and the build folder
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mac_build }}
    uses: ./.github/workflows/mac-build.yml
    with:
      config: profile
      image: macos-15-intel
      type: profile_asset
      use_cache: false
      cmake_version: *cmake_version

#### iOS Canary - macos-15 Apple Silicon ####
  iOS-macOS15-Profile:
    # Builds and processes assets in a single job to share setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ios_build }}
    uses: ./.github/workflows/ios-build.yml
    with:
      config: profile
      image: macos-15
      type: profile_asset
      use_cache: false
      cmake_version: *cmake_version

  #### iOS Canary - macos-15-intel ####
  iOS-macOS15Intel-Profile:
    # Builds and processes assets in a single job to share setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ios_build }}
    uses: ./.github/workflows/ios-build.yml
    with:
      config: profile
      image: macos-15-intel
      type: profile_asset
      use_cache: false
      cmake_version: *cmake_version

  #### Windows Canary - use latest installed v143 toolset on each runner image ####
  Windows-2025-Profile:
    # Builds, processes assets and runs tests in a single job to share setup and the build folder
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_build }}
    uses: ./.github/workflows/windows-build.yml
    with:
      compiler: msvc
      config: profile
      image: windows-2025
      platform: Windows
      type: profile_asset_test
      use_cache: false
      msvc_platform_toolset: "v143"
      cmake_version: *cmake_version

  Windows-2025-Release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_build }}
    uses: ./.github/workflows/windows-build.yml
    with:
      compiler: msvc
      config: release
      image: windows-2025
      platform: Windows
      type: release
      use_cache: false
      msvc_platform_toolset: "v143"
      cmake_version: *cmake_version

  Windows-2022-Profile:
    # Builds, processes assets and runs tests in a single job to share setup and the build folder
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_build }}
    uses: ./.github/workflows/windows-build.yml
    with:
      compiler: msvc
      config: profile
      image: windows-2022
      platform: Windows
      type: profile_asset_test
      use_cache: false
      msvc_platform_toolset: "v143"
      cmake_version: *cmake_version

