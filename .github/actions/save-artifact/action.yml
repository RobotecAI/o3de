name: Save artifact
description: Compress workspace paths into a tar archive and upload it as an artifact

inputs:
  name:
    description: Name of the artifact
    required: true
  path:
    description: Workspace paths to store in the archive
    required: true

# Note: All 3P Github Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

runs:
  using: composite
  steps:
    - name: Compress artifact
      # Compress with posix format to preserve permissions and timestamps at nanosecond precision
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/${{ inputs.name }}.tar
        ARCHIVE_PATHS: ${{ inputs.path }}
      run: |
        mkdir -p $ARCHIVE_PATHS
        tar --format=posix -cvpf "$ARCHIVE" $ARCHIVE_PATHS

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        compression-level: 0
        overwrite: true
        path: ${{ runner.temp }}/${{ inputs.name }}.tar
